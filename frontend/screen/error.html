<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error al enviar</title>
  <link rel="icon" href="../favicon/favicon.ico">
  <link rel="stylesheet" href="../styles/error.css">
</head>
<body>
  <div class="error-card">
    <div class="icon">✖</div>
    <h1>No se pudo enviar el reporte</h1>
    <p>
      Ocurrió un error al procesar tu solicitud.<br>
      Por favor, reintentá el envío o esperá unos minutos.
    </p>

    <div class="actions">
      <a href="./index.html" class="btn retry">Reintentar</a>
      <span class="hint">Si el problema persiste, intentá más tarde</span>
    </div>
  </div>
</body>
</html>
